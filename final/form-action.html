<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">

        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <meta name="description" content="View your Disneyland trip planning information.">

        <meta name="author" content="Kevin Noorda">

        <title>Your Disneyland Trip Plan | Disneyland Trip Planner</title>

        <link rel="icon"
            href="images/favicon.svg"
            type="image/svg+xml">

        <link rel="stylesheet"
            href="styles/project.css">

        <script
            type="module"
            src="scripts/main.js">
        </script>

        <script
            type="module"
            src="scripts/form-action.js">
        </script>

    </head>

    <body>

        <header class="site-header">

            <div class="header-container">

                <div>

                    <a
                        class="site-title"
                        href="index.html">
                        Disneyland Trip Planner
                    </a>

                    <p class="tagline">
                        Plan the trip. Enjoy the magic.
                    </p>

                </div>

                <button
                    class="menu-button"
                    id="menu-button"
                    type="button"
                    aria-label="Open navigation menu"
                    aria-expanded="false"
                    aria-controls="navigation">
                    ☰
                </button>

                <nav
                    class="navigation"
                    id="navigation"
                    aria-label="Main navigation">

                    <ul>

                        <li>
                            <a href="index.html">
                                Home
                            </a>
                        </li>

                        <li>
                            <a href="rides.html">
                                Rides &amp; Attractions
                            </a>
                        </li>

                        <li>
                            <a href="resources.html">
                                Trip Resources
                            </a>
                        </li>

                    </ul>

                </nav>

            </div>

        </header>


        <main>

            <section class="info-section form-layout">

                <h1 class="section-heading">
                    Your Disneyland Trip Plan
                </h1>

                <div
                    id="trip-results"
                    class="card">

                    <p>
                        Loading your trip information...
                    </p>

                </div>

                <p>
                    <a
                        class="button"
                        href="resources.html">
                        Create Another Plan
                    </a>
                </p>

            </section>

        </main>


        <footer class="site-footer">

            <p>
                &copy; 2026 Disneyland Trip Planner
            </p>

            <div class="footer-links">

                <a href="attributions.html">
                    Attributions
                </a>

            </div>

        </footer>

    </body>

</html>
